<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PS1 / N64 Player Character Inspection</title>
    <style>*{box-sizing:border-box;margin:0;padding:0}body,html{color:#e0e0e0;background:#1a1a1f;width:100%;height:100%;font-family:Courier New,Courier,monospace;overflow:hidden}#viewer-container{touch-action:none;width:100%;height:100%;position:absolute;top:0;left:0}#retro-hud{z-index:10;pointer-events:auto;background:#0a0a0fd9;border:2px solid #555;border-radius:4px;padding:14px 18px;position:absolute;top:16px;left:16px;box-shadow:0 4px 16px #0009}#retro-hud h1{letter-spacing:1px;color:#f0c040;text-transform:uppercase;margin-bottom:10px;font-size:14px}.hud-group{flex-direction:column;gap:6px;margin-bottom:10px;display:flex}.hud-group label{text-transform:uppercase;color:#aaa;font-size:11px}.hud-btn{color:#eee;cursor:pointer;background:#252530;border:1px solid #444;border-radius:2px;padding:6px 12px;font-family:inherit;font-size:12px;transition:background .1s}.hud-btn:hover{background:#3a3a4c;border-color:#888}.hud-btn.active{color:#111;background:#f0c040;font-weight:700}.btn-row{gap:6px;display:flex}#help-tip{color:#888;pointer-events:none;background:#0009;border-radius:20px;padding:6px 14px;font-size:11px;position:absolute;bottom:16px;left:50%;transform:translate(-50%)}</style>
    <script type="module" crossorigin src="/assets/character-CKuFgQGM.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-P2Xu9kJm.js">
  </head>
  <body>
    <div id="viewer-container"></div>

    <div id="retro-hud">
      <h1>Character Viewer (PS1 / N64)</h1>
      <div class="hud-group">
        <label>Mode</label>
        <div class="btn-row">
          <button id="btn-ref-pose" class="hud-btn active">Reference Pose</button>
          <button id="btn-articulation" class="hud-btn">Limb Articulation</button>
        </div>
      </div>
      <div class="hud-group">
        <label>Display</label>
        <div class="btn-row">
          <button id="btn-wireframe" class="hud-btn">Wireframe: OFF</button>
        </div>
      </div>
      <div class="hud-group">
        <label>Camera Preset</label>
        <div class="btn-row">
          <button id="cam-front" class="hud-btn">Front</button>
          <button id="cam-three-quarter" class="hud-btn">3/4</button>
          <button id="cam-profile" class="hud-btn">Side</button>
          <button id="cam-back" class="hud-btn">Back</button>
        </div>
      </div>
    </div>

    <div id="help-tip">Left-click + drag: Orbit | Right-click + drag: Pan | Scroll: Zoom</div>

  </body>
</html>
